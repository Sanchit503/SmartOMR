[project]
name = "smartomr"
version = "0.3.0"
description = "SmartOMR — OMR-based assessment pipeline (BTP, IIIT Delhi)"
requires-python = ">=3.11"

[project.scripts]
smartomr-generate = "omr.generator.main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
# Tests live beside the module they cover, so the generator folder is
# genuinely self-contained (omr/generator/tests, omr/grading/tests).
testpaths = ["omr", "prototype_eval"]
