[project]
name = "smartomr"
version = "0.3.0"
description = "SmartOMR — OMR-based assessment pipeline (BTP, IIIT Delhi)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.2",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
    "reportlab>=4.1",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
smartomr-generate = "omr.generator.main:main"
smartomr-parse = "omr.workflows.parse:main"
smartomr-batch = "omr.workflows.batch:main"
smartomr-doctor = "omr.health:main"
smartomr-train-digits = "omr.reader.digit_model:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
htr = [
    "torch>=2.2",
    "transformers>=4.40,<5",
    "sentencepiece>=0.2",
    "protobuf>=4.25",
    "tiktoken>=0.7",
]

[tool.setuptools.packages.find]
include = ["omr*", "prototype_eval*"]

[tool.setuptools.package-data]
"omr.generator" = ["configs/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
# Tests live beside the module they cover, so the generator folder is
# genuinely self-contained (omr/generator/tests, omr/grading/tests).
testpaths = ["omr", "prototype_eval"]
